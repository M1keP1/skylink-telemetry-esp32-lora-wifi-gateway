[package]
name = "kiwi-store" # todo change the name
version = "0.1.0"
edition = "2024"

[dependencies]
crc32fast = "1.5.0"
stats_alloc = "0.1.10"
thiserror = "2.0.17"
anyhow = "1.0.100"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.49.0", features = ["full"] }
serde_json = "1.0.149"
config = "0.15.19"
toml = "0.8"
io = "0.0.2"
axum = { version = "0.8.8", features = ["ws"] }
tower = "0.5.3"
chrono = "0.4.43"
tower-http = {version = "0.6.8", features = ["cors"]}

[dev-dependencies]
tokio-tungstenite = "0.26.1"
futures-util = "0.3.31"
reqwest = { version = "0.12", features = ["json"] }


